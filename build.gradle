plugins {
    id 'java-library'
    id 'com.vanniktech.maven.publish' version '0.32.0'
}

group = 'io.github.iamrushier'
version = '1.0.1'
sourceCompatibility = '1.8'
targetCompatibility = '1.8'

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.1'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.8.1'
}

test {
    useJUnitPlatform()
}

mavenPublishing {
    publishToMavenCentral(com.vanniktech.maven.publish.SonatypeHost.CENTRAL_PORTAL)
    signAllPublications()

    coordinates('io.github.iamrushier', 'rush-evaluator', '1.0.1')

    pom {
        name = 'RushEvaluator'
        description = 'A powerful and high-precision mathematical expression evaluator for Java.'
        url = 'https://github.com/iamrushier/rush-evaluator'

        licenses {
            license {
                name = 'The Apache License, Version 2.0'
                url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
            }
        }

        developers {
            developer {
                id = 'iamrushier'
                name = 'Rushikesh Surve'
                email = '134696856+iamrushier@users.noreply.github.com'
            }
        }

        scm {
            url = 'https://github.com/iamrushier/rush-evaluator'
            connection = 'scm:git:git://github.com/iamrushier/rush-evaluator.git'
            developerConnection = 'scm:git:ssh://git@github.com/iamrushier/rush-evaluator.git'
        }
    }
}

// GitHub Packages publishing target
publishing {
    repositories {
        maven {
            name = 'GitHubPackages'
            url = uri('https://maven.pkg.github.com/iamrushier/rush-evaluator')
            credentials {
                username = System.getenv('GITHUB_ACTOR')
                password = System.getenv('GITHUB_TOKEN')
            }
        }
    }
}
